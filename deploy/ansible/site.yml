---
- name: Deploy Huawei B818 Control Panel
  hosts: rpi
  become: true

  vars:
    repo_root: "{{ playbook_dir }}/../.."

  pre_tasks:
    - name: Validate deployment variables
      ansible.builtin.assert:
        that:
          - router_password is defined
          - router_password | length > 0
        fail_msg: >-
          Set router_password via a local wrapper, .env, or pass it with
          --extra-vars.

  tasks:
    - name: Install runtime packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present
        update_cache: true

    - name: Ensure application group exists
      ansible.builtin.group:
        name: "{{ app_group }}"
        system: true

    - name: Ensure application user exists
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Copy application files
      ansible.builtin.copy:
        src: "{{ repo_root }}/{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
      loop:
        - main.py
        - config.py
        - requirements.txt
        - static
        - templates
      notify: Restart application

    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv "{{ app_venv_dir }}"
        creates: "{{ app_venv_dir }}/bin/python"

    - name: Install Python dependencies
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_venv_dir }}"
      notify: Restart application

    - name: Render application environment file
      ansible.builtin.template:
        src: templates/ip-rotation.env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0600"
      no_log: true
      notify: Restart application

    - name: Install systemd service
      ansible.builtin.template:
        src: templates/ip-rotation.service.j2
        dest: "/etc/systemd/system/{{ app_service_name }}.service"
        mode: "0644"
      notify: Restart application

    - name: Enable and start the application service
      ansible.builtin.systemd:
        name: "{{ app_service_name }}"
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart application
      ansible.builtin.systemd:
        name: "{{ app_service_name }}"
        state: restarted
        daemon_reload: true