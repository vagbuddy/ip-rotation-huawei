<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huawei B818 Control Panel</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <main>
    <section class="hero">
      <div>
        <h1>Huawei B818 Control Panel</h1>
        <p>Простая панель управления: каждая операция роутера вынесена в отдельную строку с параметром, кнопкой и полем результата.</p>
      </div>
      <div class="badge">Local UI</div>
    </section>

    <section class="panel">
      <div class="table-head">
        <div>Название</div>
        <div>Инпут</div>
        <div>Кнопка</div>
        <div>Результат</div>
      </div>

      <div id="rows"></div>

      <div class="note">Если роутер недоступен, ошибка появится прямо в поле результата.</div>
    </section>
  </main>
  <script defer src="/static/dashboard.js"></script>
</body>
</html>
